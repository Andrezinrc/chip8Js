<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHIP-8 Emulator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>CHIP-8 Emulator</h1>
    </header>

    <main class="container">
        <section class="video">
            <canvas id="screen" width="64" height="32" role="img"><canvas>
        </section>

        <section class="controls">
            <label class="upload">
                <input type="file" id="rom-upload" accept=".ch8">
                <span>LOAD ROM</span>
            </label>
        </section>
    </main>

    <footer>
        <p>Build by André Moreira</p>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
