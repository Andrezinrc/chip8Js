<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHIP-8 Emulator</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
    <header>
        <h1>CHIP-8 Emulator</h1>
    </header>

    <main class="container">
        <section class="video">
            <canvas id="screen" width="64" height="32" role="img"></canvas>
        </section>

        <section class="controls">
            <label class="upload">
                <input type="file" id="rom-upload" accept=".ch8">
                <span>LOAD ROM</span>
            </label>

            <div class="speed-control">
    			<span>Speed</span>
    			<input type="range" id="speed" min="1" max="30" value="10">
    			<span id="speed-value">10x</span>
			</div>
        </section>

        <section class="keypad" id="keypad">
            <button data-key="1">1</button>
            <button data-key="2">2</button>
            <button data-key="3">3</button>
            <button data-key="C">C</button>

            <button data-key="4">4</button>
            <button data-key="5">5</button>
            <button data-key="6">6</button>
            <button data-key="D">D</button>

            <button data-key="7">7</button>
            <button data-key="8">8</button>
            <button data-key="9">9</button>
            <button data-key="E">E</button>

            <button data-key="A">A</button>
            <button data-key="0">0</button>
            <button data-key="B">B</button>
            <button data-key="F">F</button>
        </section>
    </main>

    <footer>
        <p>Build by André Moreira</p>
    </footer>

    <script type="module" src="main.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js");
        }
    </script>
</body>
</html>
